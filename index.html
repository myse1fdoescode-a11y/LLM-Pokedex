<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="style.css">
	<link rel="icon" type="image/png" href="Images/pokeball-tab-image.png">
	
	<!-- Fonts -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
	<title>Pokedex</title>
</head>
<body>
	<nav>
		<header>
			<h1>P <img style="width: 3rem;" src="Images/pokeball-tab-image.png" alt="PokeBall"> kedex</h1>
		</header>
		<form action="/submit" method="POST">
			<div class="input-wrapper">
				<input type="text" name="search-query" id="search-query">
				<button type="submit">Search</button>
			</div>
			<div class="type-filter-accordion">
				<div class="accordion-header"></div>
				<div class="drop-down collapsed"></div>
			</div>
		</form>
		<button id="help">Confused?</button>
	</nav>
	<!-- !Status -->
	<div id="status-container">
		<div class="load-container">
			<div class="pokedex hidden">
				<h4 data-frame="3" class="pixel-text" >Loading</h4>
				<img src="Images/pokeball-tab-image.png" alt="spinning pokeball">
			</div>
			<div class="preview hidden">
				<figure class="pokeball">
					<img src="Images/pokeball-tab-image.png" alt="pokeball" srcset>
					<span class="animate-sphere"></span>
				</figure>
				<h4 data-frame="2" class="pixel-text">Searching</h4>
			</div>
		</div>
		<aside id="error-container" class="hidden"></aside>
	</div>
	<main>
		<section id="pokedex" class="card-container">
			<button id="exit-pokedex" class="pixel-text">Exit</button>
			<div class="mobile-controls">
				<button data-direction="previous" aria-label="Previous Pokemon" class="pokedex-nav-btn"><img src="Images/double-chevron.png" alt="pixelated double chevron"></button>
				<button data-direction="next" aria-label=" Next Pokemon" class="pokedex-nav-btn"><img src="Images/double-chevron.png" alt="pixelated double chevron"></button>
			</div>			
			<aside class="pokedex-nav-wrapper">
				<button data-direction="previous" aria-label="Previous Pokemon" class="pokedex-nav-btn"><img src="Images/double-chevron.png" alt="pixelated double chevron"></button>
			</aside>
			<!-- Main pokedex card -->
				<div class="pokedex-card theme-color-border"></div>
			<aside class="pokedex-nav-wrapper">
				<button data-direction="next" aria-label=" Next Pokemon" class="pokedex-nav-btn"><img src="Images/double-chevron.png" alt="pixelated double chevron"></button>
			</aside>
		</section>
		<section id="preview" class="">
			<h2 class="page-number pixel-text"></h2>
			<div id="preview-container"></div>
			<div class="page-control-container">
				<button data-direction="previous" aria-label="Previous Pokemon" class="page-control pixel-text">Previous</button>
				<button data-direction="next" aria-label=" Next Pokemon" class="page-control pixel-text">Next</button>
			</div>
		</section>
	</main>
	<script src="app.js"></script>
	<script src="https://kit.fontawesome.com/ba3a0824a2.js" crossorigin="anonymous"></script>
</body>
</html>
